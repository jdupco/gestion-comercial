{% extends "core/base.html" %}

{% block title %}Inicio | Gestión comercial{% endblock %}

{% block content %}
    <h2>Clientes registrados</h2>

    <ul>
        {% for cliente in clientes %}
            <li>
                {{ cliente.nombre }} — {{ cliente.correo }}
            </li>
        {% empty %}
            <li>No hay clientes registrados.</li>
        {% endfor %}
    </ul>
{% endblock %}
